name: Yocto Build

on:
  push:
    branches:
      - '**'  # Matches all branches

jobs:
  build:
    runs-on: ubuntu-large-runner
    steps:

      - name: Configure network settings
        run: |
          # Configurare variabili d'ambiente per Yocto per disabilitare l'isolamento di rete
          echo "BB_ISOLATE_NETWORK=0" >> $GITHUB_ENV
          echo "BB_NO_NETWORK=0" >> $GITHUB_ENV
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
            python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 \
            curl python-is-python3 bmap-tools
          sudo locale-gen en_US.UTF-8

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "${HOME}/bin" >> $GITHUB_PATH

      - name: Initialize Yocto Environment
        run: |
          mkdir -p yocto-astrial
          cd yocto-astrial
          repo init -u https://github.com/nxp-imx/imx-manifest -b imx-linux-kirkstone -m imx-5.15.71-2.2.0.xml
          mkdir -p .repo/local_manifests
          wget --directory-prefix .repo/local_manifests https://raw.githubusercontent.com/robertoviola-systemelectronics/meta-sysele-nxp-5.15.71/refs/heads/os-release-signing/manifest/astrial-5.15.71.xml
          repo sync

      - name: Patch BitBake worker functionality
        run: |
          cat > bitbake-worker.patch << 'EOF'
          --- bitbake-worker.orig      2023-04-01 00:00:00.000000000 +0000
          +++ bitbake-worker   2023-04-01 00:00:00.000000000 +0000
          @@ -266,7 +266,11 @@
               uid = worker.parent.worker_uid
               gid = worker.parent.worker_gid
               create_process_group = worker.parent.create_process_group
          -    bb.utils.disable_network(uid, gid)
          +    try:
          +        bb.utils.disable_network(uid, gid)
          +    except PermissionError:
          +        bb.warn("Cannot disable network in this environment, continuing without network isolation")
          +        pass
               if worker.parent.umask:
                   os.umask(worker.parent.umask)
          EOF
          
          BITBAKE_WORKER=$(find /home/runner/work/meta-sysele-nxp-5.15.71/meta-sysele-nxp-5.15.71/yocto-astrial/sources/poky/bitbake/bin -name "bitbake-worker")
          cp $BITBAKE_WORKER ${BITBAKE_WORKER}.bak
          patch $BITBAKE_WORKER < bitbake-worker.patch || echo "Patch può aver fallito, ma continuiamo"

      - name: Generate Build Signature
        run: |
          # Generate build signature using GitHub secret
          if [ "${{ secrets.BUILD_SIGNING_KEY }}" != "" ]; then
            # Create a unique signature combining various elements
            SIGNATURE_INPUT="${GITHUB_SHA}|${GITHUB_REPOSITORY}|${GITHUB_RUN_ID}|${{ secrets.BUILD_SIGNING_KEY }}"
            BUILD_SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -hmac "${{ secrets.BUILD_SIGNING_KEY }}" -hex | cut -d' ' -f2)
          else
            BUILD_SIGNATURE="unofficial"
          fi
          echo "BUILD_SIGNATURE=${BUILD_SIGNATURE}" >> $GITHUB_ENV

      - name: Build Image
        run: |
          cd yocto-astrial
          source astrial-setup-env -b build
          echo 'BB_NETWORK_ISOLATION_FORCEON = "0"' >> conf/local.conf
          echo "BB_GENERATE_MIRROR_TARBALLS = \"1\"" >> conf/local.conf
          echo "BB_NO_NETWORK = \"0\"" >> conf/local.conf          
           # Pass the signature to bitbake
          export BB_ENV_PASSTHROUGH_ADDITIONS="GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BUILD_SIGNATURE"
          bitbake system-astrial-image

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build
          path: |
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/imx-boot-astrial-imx8mp-sd.bin-flash_evk
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/system-astrial-image-astrial-imx8mp-*.rootfs.wic.zst
