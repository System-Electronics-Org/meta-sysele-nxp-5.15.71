name: Yocto Build
on:
  push:
    branches:
      - '**'  # Matches all branches
jobs:
  build:
    runs-on: ubuntu-large-runner
    container:
      image: ubuntu:latest
      options: --privileged  # Run with privileged mode
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
            python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 \
            curl python-is-python3 bmap-tools bash sudo
          locale-gen en_US.UTF-8
          
          # Create a non-root user for running bitbake
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
        shell: bash
      - name: Install repo tool
        run: |
          mkdir -p /home/builder/bin
          curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > /home/builder/bin/repo
          chmod a+x /home/builder/bin/repo
          chown -R builder:builder /home/builder/bin
        shell: bash
      - name: Initialize Yocto Environment
        run: |
          mkdir -p /home/builder/yocto-astrial
          cd /home/builder/yocto-astrial
          # Run as the builder user
          su - builder -c "export PATH=\$PATH:/home/builder/bin && cd /home/builder/yocto-astrial && repo init -u https://github.com/nxp-imx/imx-manifest -b imx-linux-kirkstone -m imx-5.15.71-2.2.0.xml"
          su - builder -c "export PATH=\$PATH:/home/builder/bin && cd /home/builder/yocto-astrial && mkdir -p .repo/local_manifests"
          su - builder -c "export PATH=\$PATH:/home/builder/bin && cd /home/builder/yocto-astrial && wget --directory-prefix .repo/local_manifests https://raw.githubusercontent.com/robertoviola-systemelectronics/meta-sysele-nxp-5.15.71/refs/heads/os-release-signing/manifest/astrial-5.15.71.xml"
          su - builder -c "export PATH=\$PATH:/home/builder/bin && cd /home/builder/yocto-astrial && repo sync"
        shell: bash
      - name: Generate Build Signature
        run: |
          # Generate build signature using GitHub secret
          if [ "${{ secrets.BUILD_SIGNING_KEY }}" != "" ]; then
            # Create a unique signature combining various elements
            SIGNATURE_INPUT="${GITHUB_SHA}|${GITHUB_REPOSITORY}|${GITHUB_RUN_ID}|${{ secrets.BUILD_SIGNING_KEY }}"
            BUILD_SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -hmac "${{ secrets.BUILD_SIGNING_KEY }}" -hex | cut -d' ' -f2)
          else
            BUILD_SIGNATURE="unofficial"
          fi
          echo "BUILD_SIGNATURE=${BUILD_SIGNATURE}" >> $GITHUB_ENV
        shell: bash
      - name: Build Image
        run: |
          # Run bitbake as the builder user
          su - builder -c "export PATH=\$PATH:/home/builder/bin && cd /home/builder/yocto-astrial && . astrial-setup-env -b build && export BB_ENV_PASSTHROUGH_ADDITIONS=\"GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BUILD_SIGNATURE\" && echo 'BB_NETWORK_ISOLATION_ENABLED = \"0\"' >> conf/local.conf && echo 'PSEUDO_DISABLED = \"1\"' >> conf/local.conf && echo 'INHERIT:remove = \"rm_work\"' >> conf/local.conf && PSEUDO_DISABLED=1 BB_NETWORK_ISOLATION_ENABLED=0 bitbake system-astrial-image"
        shell: bash
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build
          path: |
            /home/builder/yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/imx-boot-astrial-imx8mp-sd.bin-flash_evk
            /home/builder/yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/system-astrial-image-astrial-imx8mp-*.rootfs.wic.zst
