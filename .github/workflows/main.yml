name: Yocto Build

on:
  push:
    branches:
      - '**'  # Matches all branches

jobs:
  build:
    runs-on: ubuntu-large-runner
    steps:

      - name: Configure network settings
        run: |
          # Configure environment variables for Yocto to disable network isolation
          echo "BB_ISOLATE_NETWORK=0" >> $GITHUB_ENV
          echo "BB_NO_NETWORK=0" >> $GITHUB_ENV
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
            python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 \
            curl python-is-python3 bmap-tools
          sudo locale-gen en_US.UTF-8

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "${HOME}/bin" >> $GITHUB_PATH

      - name: Initialize Yocto Environment
        run: |
          mkdir -p yocto-astrial
          cd yocto-astrial
          repo init -u https://github.com/nxp-imx/imx-manifest -b imx-linux-kirkstone -m imx-5.15.71-2.2.0.xml
          mkdir -p .repo/local_manifests
          wget --directory-prefix .repo/local_manifests https://raw.githubusercontent.com/robertoviola-systemelectronics/meta-sysele-nxp-5.15.71/refs/heads/os-release-signing/manifest/astrial-5.15.71.xml
          repo sync

      - name: Generate Build Signature
        run: |
          # Generate build signature using GitHub secret
          if [ "${{ secrets.BUILD_SIGNING_KEY }}" != "" ]; then
            # Create a unique signature combining various elements
            SIGNATURE_INPUT="${GITHUB_SHA}|${GITHUB_REPOSITORY}|${GITHUB_RUN_ID}|${{ secrets.BUILD_SIGNING_KEY }}"
            BUILD_SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -hmac "${{ secrets.BUILD_SIGNING_KEY }}" -hex | cut -d' ' -f2)
          else
            BUILD_SIGNATURE="unofficial"
          fi
          echo "BUILD_SIGNATURE=${BUILD_SIGNATURE}" >> $GITHUB_ENV

      - name: Prepare Patched BitBake
        run: |
          # Create a directory for our modified setup scripts
          mkdir -p bitbake-patch
          
          # Create a modified setup-environment wrapper script
          cat <<EOF > bitbake-patch/setup-env-wrapper.sh
          #!/bin/bash
          
          # Source the original setup environment
          source \$1
          
          # Now patch BitBake files to disable network isolation
          
          # 1. Patch the BitBake worker script directly
          BB_WORKER="\${BUILDDIR}/../sources/poky/bitbake/bin/bitbake-worker"
          if [ -f "\${BB_WORKER}" ]; then
            echo "Patching BitBake worker at \${BB_WORKER}"
            cp "\${BB_WORKER}" "\${BB_WORKER}.orig"
            sed -i 's/bb.utils.disable_network(uid, gid)/# Network isolation disabled/' "\${BB_WORKER}"
          else
            echo "Warning: BitBake worker not found at \${BB_WORKER}"
          fi
          
          # 2. Patch the utils.py file as well
          BB_UTILS="\${BUILDDIR}/../sources/poky/bitbake/lib/bb/utils.py"
          if [ -f "\${BB_UTILS}" ]; then
            echo "Patching BitBake utils at \${BB_UTILS}"
            cp "\${BB_UTILS}" "\${BB_UTILS}.orig"
            sed -i 's/def disable_network(uid, gid):/def disable_network(uid, gid):\n    return  # Function disabled/' "\${BB_UTILS}"
          else
            echo "Warning: BitBake utils not found at \${BB_UTILS}"
          fi
          
          # 3. Create a custom configuration file to disable network isolation
          mkdir -p "\${BUILDDIR}/conf"
          cat <<EOC >> "\${BUILDDIR}/conf/local.conf"
          
          # Disable network isolation
          BB_ISOLATE_NETWORK = "0"
          BB_NO_NETWORK = "0"
          EOC
          
          # Return the original return code
          return \$?
          EOF

          chmod +x bitbake-patch/setup-env-wrapper.sh

      - name: Build Image
        run: |
          # Copy our patching scripts to the yocto directory
          cp -r bitbake-patch yocto-astrial/
          
          docker run --privileged -v ${{ github.workspace }}/yocto-astrial:/yocto-astrial ubuntu:20.04 bash -c "
                export DEBIAN_FRONTEND=noninteractive &&
                export TZ=Europe/Rome &&
                apt-get update && 
                apt-get install -y tzdata &&
                apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 curl && 
                locale-gen en_US.UTF-8 &&
                groupadd -g 1000 yoctouser && 
                useradd -u 1000 -g 1000 -s /bin/bash -m yoctouser && 
                chown -R yoctouser:yoctouser /yocto-astrial && 
                su - yoctouser -c 'cd /yocto-astrial && 
                bash -c \"
                # Use our wrapper to setup the environment and patch BitBake
                source bitbake-patch/setup-env-wrapper.sh astrial-setup-env -b build && 
                
                # Set environment variables
                export BB_ISOLATE_NETWORK=0 && 
                export BB_NO_NETWORK=0 && 
                export BUILD_SIGNATURE=\\\"$BUILD_SIGNATURE\\\" && 
                export BB_ENV_PASSTHROUGH_ADDITIONS=\\\"GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BUILD_SIGNATURE BB_ISOLATE_NETWORK BB_NO_NETWORK\\\" && 
                
                # Run BitBake commands with isolation disabled
                bitbake -D BB_ISOLATE_NETWORK=0 -D BB_NO_NETWORK=0 --runall=fetch system-astrial-image &&
                bitbake -D BB_ISOLATE_NETWORK=0 -D BB_NO_NETWORK=0 --no-setscene -k system-astrial-image\"'
              "

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build
          path: |
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/imx-boot-astrial-imx8mp-sd.bin-flash_evk
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/system-astrial-image-astrial-imx8mp-*.rootfs.wic.zst
