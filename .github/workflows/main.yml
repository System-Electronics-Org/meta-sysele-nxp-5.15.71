name: Yocto Build

on:
  push:
    branches:
      - '**'  # Matches all branches

jobs:
  build:
    runs-on: ubuntu-large-runner
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
            python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 \
            curl python-is-python3 bmap-tools
          sudo locale-gen en_US.UTF-8

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "${HOME}/bin" >> $GITHUB_PATH

      - name: Initialize Yocto Environment
        run: |
          mkdir -p yocto-astrial
          cd yocto-astrial
          repo init -u https://github.com/nxp-imx/imx-manifest -b imx-linux-kirkstone -m imx-5.15.71-2.2.0.xml
          mkdir -p .repo/local_manifests
          wget --directory-prefix .repo/local_manifests https://raw.githubusercontent.com/robertoviola-systemelectronics/meta-sysele-nxp-5.15.71/refs/heads/os-release-signing/manifest/astrial-5.15.71.xml
          repo sync

      - name: Generate Build Signature
        run: |
          # Generate build signature using GitHub secret
          if [ "${{ secrets.BUILD_SIGNING_KEY }}" != "" ]; then
            # Create a unique signature combining various elements
            SIGNATURE_INPUT="${GITHUB_SHA}|${GITHUB_REPOSITORY}|${GITHUB_RUN_ID}|${{ secrets.BUILD_SIGNING_KEY }}"
            BUILD_SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -hmac "${{ secrets.BUILD_SIGNING_KEY }}" -hex | cut -d' ' -f2)
          else
            BUILD_SIGNATURE="unofficial"
          fi
          echo "BUILD_SIGNATURE=${BUILD_SIGNATURE}" >> $GITHUB_ENV

      - name: Prepare Custom Dockerfile
        run: |
          # Create a modified version of the Dockerfile that adds unshare capability
          cat <<EOF > Dockerfile.yocto
          FROM ubuntu:20.04

          # Install dependencies
          ENV DEBIAN_FRONTEND=noninteractive
          ENV TZ=Europe/Rome
          
          RUN apt-get update && \
              apt-get install -y tzdata && \
              apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
              chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
              iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
              python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 curl \
              libcap2-bin uidmap

          # Generate locales
          RUN locale-gen en_US.UTF-8
          
          # Create yoctouser and setup rootless mode
          RUN groupadd -g 1000 yoctouser && \
              useradd -u 1000 -g 1000 -s /bin/bash -m yoctouser && \
              mkdir -p /etc/sudoers.d && \
              echo "yoctouser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/yoctouser
              
          # Setup alternative for network isolation in BitBake
          COPY fake-unshare.sh /usr/local/bin/unshare
          RUN chmod +x /usr/local/bin/unshare && \
              echo 'Installed fake unshare script'
          
          USER yoctouser
          WORKDIR /home/yoctouser
          EOF
          
          # Create a fake unshare script that will be used instead of the real one
          cat <<EOF > fake-unshare.sh
          #!/bin/bash
          
          # This is a fake unshare script that doesn't actually isolate anything
          # but pretends to do so for BitBake's satisfaction
          
          # Get the command to execute
          cmd=""
          while [[ \$# -gt 0 ]]; do
              case \$1 in
                  --mount|--uts|--ipc|--net|--pid|--mount-proc|-m|-u|-i|-n|-p|-f)
                      shift
                      ;;
                  --mount=*|--uts=*|--ipc=*|--net=*|--pid=*|--mount-proc=*)
                      ;;
                  *)
                      if [ -z "\$cmd" ]; then
                          cmd="\$1"
                      else
                          cmd="\$cmd \$1"
                      fi
                      ;;
              esac
              shift
          done
          
          # Execute the command without any namespace isolation
          echo "Executing without namespace isolation: \$cmd"
          exec \$cmd
          EOF

      - name: Build Docker Image
        run: |
          docker build -t yocto-builder -f Dockerfile.yocto .

      - name: Build Image
        run: |
          docker run --privileged -v ${{ github.workspace }}/yocto-astrial:/yocto-astrial yocto-builder bash -c "
            cd /yocto-astrial && 
            bash -c \"source astrial-setup-env -b build && 
            
            # Add custom configuration to local.conf
            echo 'BB_ISOLATE_NETWORK = \"0\"' >> conf/local.conf && 
            echo 'BB_NO_NETWORK = \"0\"' >> conf/local.conf && 
            
            # Set environment variables
            export BB_ISOLATE_NETWORK=0 && 
            export BB_NO_NETWORK=0 && 
            export BUILD_SIGNATURE=\\\"$BUILD_SIGNATURE\\\" && 
            export BB_ENV_PASSTHROUGH_ADDITIONS=\\\"GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BUILD_SIGNATURE BB_ISOLATE_NETWORK BB_NO_NETWORK\\\" && 
            
            # Run BitBake commands with isolation disabled
            bitbake -D BB_ISOLATE_NETWORK=0 -D BB_NO_NETWORK=0 --no-setscene -k system-astrial-image\"
          "

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build
          path: |
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/imx-boot-astrial-imx8mp-sd.bin-flash_evk
            yocto-astrial/build/tmp/deploy/images/astrial-imx8mp/system-astrial-image-astrial-imx8mp-*.rootfs.wic.zst
